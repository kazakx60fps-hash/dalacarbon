{% extends "base.html" %}

{% block title %}{{ title }} — DalaCarbon AI{% endblock %}

{% block content %}
<section class="card card--center" aria-labelledby="error-title">
  <div class="card__head">
    <h1 id="error-title">{{ title }}</h1>
    <p>{{ message }}</p>
  </div>
  <a class="btn btn--primary" href="{{ url_for('auth.register') }}">Тіркелу бетіне оралу</a>
</section>
{% endblock %}
