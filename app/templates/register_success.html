{% extends "base.html" %}

{% block title %}Тіркелу сәтті өтті — DalaCarbon AI{% endblock %}

{% block content %}
<section class="card card--center card--success" aria-labelledby="success-title">
  <span class="success-badge" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </span>
  <div class="card__head">
    <h1 id="success-title" role="status">Тіркелу сәтті өтті!</h1>
    <p>Енді <strong class="hl">{{ username }}</strong> логині мен құпиясөзіңіз арқылы жүйеге кіре аласыз.</p>
  </div>
  <a class="btn btn--primary" href="{{ url_for('auth.login') }}">Кіру бетіне өту</a>
</section>
{% endblock %}
